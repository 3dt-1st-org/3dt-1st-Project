name: Feature
description: 새로운 기능 추가
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: 📌 배경 / 목적
      description: 왜 이 기능이 필요한가?
      placeholder: 예) Blob 데이터를 Cosmos로 적재하기 위함
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: ✅ 작업 내용
      description: 무엇을 구현해야 하는가?
      placeholder: |
        - Blob 트리거 구현
        - Cosmos DB 저장 로직 추가
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 🎯 완료 조건
      description: 언제 Done으로 볼 것인가?
      placeholder: |
        - 테스트 통과
        - dev 배포 확인 완료
    validations:
      required: true
