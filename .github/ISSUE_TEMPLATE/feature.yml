name: "🚀 Feature"
description: 새로운 기능 개발
title: "[Feature] "
labels: ["feature"]
projects: ["OWNER/PROJECT_NUMBER"]   # ← 여기 OWNER/번호 수정

body:
  - type: textarea
    id: background
    attributes:
      label: 📌 배경 / 목적
      description: 왜 이 기능이 필요한가?
      placeholder: 예) Blob 데이터를 Cosmos DB로 적재하기 위함
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: ✅ 작업 내용
      placeholder: |
        - Blob 트리거 구현
        - Cosmos 저장 로직 작성
        - 테스트 코드 작성
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 🎯 완료 조건
      placeholder: |
        - PR merge 완료
        - dev 배포 성공
        - 테스트 통과
    validations:
      required: true
