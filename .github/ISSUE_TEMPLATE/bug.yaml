name: "🐛 Bug"
description: 버그 수정
title: "[Bug] "
labels: ["bug"]
projects: ["OWNER/PROJECT_NUMBER"]   # ← 동일하게 수정

body:
  - type: textarea
    id: problem
    attributes:
      label: 🐛 문제 설명
      placeholder: 무엇이 잘못되었는가?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 기대 동작
      placeholder: 정상적으로는 어떻게 동작해야 하는가?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 재현 방법
      placeholder: |
        1. Blob 업로드
        2. 함수 실행 확인
        3. 에러 발생
