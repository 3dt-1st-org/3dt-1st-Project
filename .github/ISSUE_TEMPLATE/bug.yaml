name: "Bug"
description: 버그 수정
title: "fix(scope): "
labels: ["bug"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: 어떤 문제가 발생했는가?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: 정상 동작은 무엇인가?
