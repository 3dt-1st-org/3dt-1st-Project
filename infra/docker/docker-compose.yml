version: '3.8'

services:
  db:
    build: .   # <-- 핵심: 현재 폴더(.)에 있는 Dockerfile을 사용해 빌드하라는 뜻
    container_name: geo-ai-db
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: