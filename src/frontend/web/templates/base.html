<!DOCTYPE html>
<html lang="{{ current_lang() }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iOS PWA 종일 화면 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- 주소표시줄 / 상태바 테마색 -->
  <meta name="theme-color" content="#2B6CB0" />
  <title>{% block title %}LALA{% endblock %}</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 오방색 테마 & 레이아웃 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}" />

  {% block head %}{% endblock %}
</head>
<body>

  <!-- GNB -->
  <nav class="gnb">
    <a href="/" class="gnb__logo obang-border">LALA</a>
    <div class="gnb__actions">
      <a href="/map"      class="gnb__nav-btn" aria-label="지도">{{ t('nav_map') }}</a>
      <a href="/settings" class="gnb__nav-btn" aria-label="설정">&#9881;&#65039; {{ t('nav_settings') }}</a>
    </div>
  </nav>

  <!-- 페이지 본문 -->
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
