{% extends "base.html" %}
{% block title %}LALA{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<section class="splash-screen fullscreen-page">
  <div class="splash-screen__logo obang-border">LALA</div>
  <p class="splash-screen__sub">{{ t('splash_sub') }}</p>
</section>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    const S = window.LalaState;
    S.ensureDefaults();

    const hasEver = S.getBool(S.keys.hasEverLaunched, false);
    const accepted = S.getBool(S.keys.hasAcceptedPrivacyNotice, false);
    const consent = S.getBool(S.keys.isLocationConsentEnabled, false);
    const onboarding = S.getBool(S.keys.hasCompletedOnboarding, false);

    function routeNext() {
      if (!accepted) {
        window.location.replace('/privacy');
        return;
      }
      if (!consent) {
        window.location.replace('/location-consent');
        return;
      }
      if (!onboarding) {
        window.location.replace('/onboarding');
        return;
      }
      window.location.replace('/map');
    }

    if (!hasEver) {
      S.setBool(S.keys.hasEverLaunched, true);
      setTimeout(() => window.location.replace('/privacy'), 1400);
      return;
    }

    setTimeout(routeNext, 900);
  })();
</script>
{% endblock %}
